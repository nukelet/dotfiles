# [lkcamp-online]
# source            = imaps://vpeixoto@lkcamp.dev@imap.purelymail.com
# source-cred-cmd   = secret-tool lookup mail lkcamp
# outgoing          = smtps://vpeixoto@lkcamp.dev@smtp.purelymail.com
# outgoing-cred-cmd = secret-tool lookup mail lkcamp
# default           = INBOX
# from              = "Vinicius Peixoto" <vpeixoto@lkcamp.dev>
# copy-to           = Sent
# cache-headers     = true

[lkcamp]
source                  = notmuch://~/mail/
maildir-store           = ~/mail/
maildir-account-path    = lkcamp
copy-to                 = Sent
query-map               = /home/nuke/.config/aerc/maps/lkcamp.conf
folders-sort            = INBOX, Sent
folders-exclude         = sort
outgoing                = smtps://vpeixoto@lkcamp.dev@smtp.purelymail.com
outgoing-cred-cmd       = secret-tool lookup mail lkcamp
default                 = Inbox
from                    = "Vinicius Peixoto" <vpeixoto@lkcamp.dev>
